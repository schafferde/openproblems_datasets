name: process_local_h5ad
namespace: workflows/scrnaseq
description: |
  Fetch and process local h5ad datasets
argument_groups:
  - name: Inputs
    arguments:
      - name: --id
        type: string
        description: Unique identifier of the dataset.
        required: true
      - name: --file_name
        type: string
        description: The filename (.h5ad) to look for
        required: true
      - name: --obs_cell_type
        type: string
        description: Location of where to find the observation cell types.
      - name: --obs_batch
        type: string
        description: Location of where to find the observation batch IDs.
      - name: --obs_tissue
        type: string
        description: Location of where to find the observation tissue information.
      - name: --layer_counts
        type: string
        description: In which layer to find the counts matrix. Leave undefined to
          use `.X`.
        example: counts
      - name: --sparse
        type: boolean
        default: true
        description: Convert layers to a sparse CSR format.
      - name: --var_feature_id
        type: string
        description: Location of where to find the feature IDs. Can be set to index
          if the feature IDs are the index.
        example: gene_ids
      - name: --var_feature_name
        type: string
        description: Location of where to find the feature names. Can be set to index
          if the feature names are the index.
        default: index
  - name: Metadata
    arguments:
      - name: --dataset_name
        type: string
        description: Nicely formatted name.
        required: true
      - name: --dataset_url
        type: string
        description: Link to the original source of the dataset.
        required: false
      - name: --dataset_reference
        type: string
        description: Bibtex reference of the paper in which the dataset was published.
        required: false
      - name: --dataset_summary
        type: string
        description: Short description of the dataset.
        required: true
      - name: --dataset_description
        type: string
        description: Long description of the dataset.
        required: true
      - name: --dataset_organism
        type: string
        description: The organism of the dataset.
        required: false
  - name: Normalization
    arguments:
      - name: --normalization_methods
        type: string
        multiple: true
        choices: [log_cp10k, log_cpm, sqrt_cp10k, sqrt_cpm, l1_sqrt, log_scran_pooling]
        default: [log_cp10k, log_cpm, sqrt_cp10k, sqrt_cpm, l1_sqrt]
        description: Which normalization methods to run.
  - name: Outputs
    arguments:
      - name: --output_dataset
        __merge__: /src/api/file_common_dataset.yaml
        direction: output
        required: true
      - name: --output_meta
        direction: output
        type: file
        description: Dataset metadata
        default: dataset_metadata.yaml
      - name: --output_raw
        __merge__: /src/api/file_raw.yaml
        direction: output
        required: false
      - name: --output_normalized
        __merge__: /src/api/file_normalized.yaml
        direction: output
        required: false
      - name: --output_pca
        __merge__: /src/api/file_pca.yaml
        direction: output
        required: false
      - name: --output_hvg
        __merge__: /src/api/file_hvg.yaml
        direction: output
        required: false
      - name: --output_knn
        __merge__: /src/api/file_knn.yaml
        direction: output
        required: false
resources:
  - type: nextflow_script
    path: main.nf
    entrypoint: run_wf
  - path: /common/nextflow_helpers/helper.nf
dependencies:
  - name: loaders/scrnaseq/local_h5ad
  - name: normalization/log_cp
  - name: normalization/log_scran_pooling
  - name: normalization/sqrt_cp
  - name: normalization/l1_sqrt
  - name: processors/pca
  - name: processors/hvg
  - name: processors/knn
  - name: utils/extract_uns_metadata
    repository: openproblems
  # test_resources:
  #   - type: nextflow_script
  #     path: main.nf
  #     entrypoint: test_wf
runners:
  - type: nextflow
